name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the fields below so we can reproduce and fix it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How can we reproduce this? Include the Renovate config snippet, the datasource query, or the CLI invocation.
      placeholder: |
        1. Configure Renovate with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error messages or unexpected output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: renovate-alpine-datasource version
      placeholder: vX.Y.Z or commit SHA
    validations:
      required: true
  - type: input
    id: alpine
    attributes:
      label: Alpine branch / repository
      description: e.g. v3.20/main, edge/community
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Rendered as a code block automatically.
      render: shell
    validations:
      required: false
