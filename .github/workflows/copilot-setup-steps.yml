# Setup steps run inside GitHub Copilot's coding-agent dev environment.
# Docs: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
#
# The job MUST be named `copilot-setup-steps` or Copilot will not pick it up.
# Keep this minimal — heavier tool warming (golangci-lint, go-test-coverage)
# happens lazily on the first `make lint` / `make coverage` call and is
# cached by the Go module cache.

name: Copilot setup steps

on:
  # Run automatically when the file changes so Copilot's environment picks up
  # the latest setup. Also allow manual dispatch for validation.
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # `stable` always resolves to the latest released Go minor (currently
          # 1.26), so this never drifts — no manual bump when a new Go ships.
          # Our `latest-1` floor (Go 1.25) is encoded in go.mod and exercised
          # by the CI matrix in ci.yml; Copilot just uses latest.
          go-version: 'stable'
      - name: Download Go module dependencies
        run: go mod download
